[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stablehlo-coreml"
dynamic = ["version"]
authors = [
    { name="Kasper Nielsen", email="kasper0406@gmail.com" },
]
description = "Convert StableHLO models into Apple Core ML format"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development"
]
keywords=[ "stablehlo", "hlo", "xla", "coreml", "machinelearning", "ml", "coremltools", "converter", "neural" ]
requires-python = ">=3.10,<3.14"

dependencies = [
    "coremltools>=9.0",
    "numpy~=2.0",

    # Jax is not actually a strict requirement for the main library.
    # However, the code relies on the mlir StableHLO python bindings, and currently they are not published to pip
    # and the only pre-built stand-alone library is only built for linux.
    # Onces https://github.com/openxla/stablehlo/issues/2346 is resolved, this dependency can be switch to stablehlo instead.
    "jax>=0.9.1",
]

[tool.hatch.version]
path = "stablehlo_coreml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["stablehlo_coreml"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13"]

[tool.hatch.envs.test]
randomize = true
parallel = true

extra-dependencies = [
    "pytest",
    # flax < 0.12.9 fails to import against jax 0.11 (jax.experimental.hijax changes)
    "flax>=0.12.9",
    "flatbuffers",
    "einops",
    "pillow",
    "equinox>=0.13.8",
    "pytest-cov",
]

[tool.hatch.envs.test.scripts]
test-with-cov = "pytest --cov=stablehlo_coreml --cov-report=term-missing"

[[tool.hatch.envs.test-pytorch.matrix]]
python = ["3.12", "3.13"]

[tool.hatch.envs.test-pytorch]
randomize = true
parallel = true

extra-dependencies = [
    "pytest",
    # TorchAX still imports aten.qr, which PyTorch 2.14 removed.
    "torch>=2.13.0,<2.14.0",
    "torchvision>=0.28.0,<0.29.0",
    # torchax 0.0.13 imports removed PyTorch 2.13 named-tensor overloads
    # (aten.prod.dim_Dimname) at module import. google/torchax#102 is on
    # 0.0.14.dev* nightlies (no stable 0.0.14 yet). Pin the post-fix nightly
    # exactly so hatch/pip will install the pre-release without --pre.
    "torchax==0.0.14.dev20260903",
    "flax>=0.12.9", # torchax wants flax to be installed; 0.12.9 needed for jax 0.11
    "transformers>=5.12.0",
]

[tool.hatch.envs.lint]
extra-dependencies = [
    "ruff",
]

[tool.hatch.envs.lint.scripts]
check = "ruff check ."
fix = "ruff check --fix ."

[tool.ruff]
target-version = "py312"
line-length = 127

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "SIM",            # flake8-simplify
    "RUF",            # ruff-specific
    "PLC0415",        # import not at top of file
]
ignore = [
    "B905",    # zip() without strict= — too noisy for this codebase
    "RUF002",  # ambiguous unicode in docstrings (en-dash) — intentional
    "RUF003",  # ambiguous unicode in comments (×) — intentional
    "RUF005",  # collection concat vs unpacking — stylistic, often less readable
    "SIM108",  # ternary operator — can hurt readability
    "SIM102",  # nested if → combined if — can hurt readability
]

[project.urls]
Homepage = "https://github.com/kasper0406/stablehlo-coreml"
Issues = "https://github.com/kasper0406/stablehlo-coreml/issues"
